[project]
name = "gba-streamer"
version = "0.1.0"
description = "Collaborative real-time gaming platform embedded inside Telegram"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiortc>=1.0.0",
    "pyboy>=2.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "types-pyyaml>=6.0.12.20260518",
]
